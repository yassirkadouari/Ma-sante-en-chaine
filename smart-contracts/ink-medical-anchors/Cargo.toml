[package]
name = "medical_anchors_contract"
version = "0.1.0"
authors = ["Ma Sante en Chaine"]
edition = "2021"
license = "UNLICENSED"
publish = false

[dependencies]
ink = { version = "5.1.1", default-features = false }
scale = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.3", default-features = false, features = ["derive"], optional = true }

[lib]
name = "medical_anchors_contract"
path = "lib.rs"

[features]
default = ["std"]
std = [
  "ink/std",
  "scale/std",
  "scale-info/std",
]
ink-as-dependency = []
e2e-tests = []
